<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Langent - Suseo Map Visualization</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #00000a;
            --panel: rgba(10, 10, 30, 0.85);
            --accent: #00f0ff;
            --text: #e0e0e0;
        }

        body,
        html {
            margin: 0;
            padding: 0;
            height: 100%;
            background: var.bg;
            font-family: 'Outfit', sans-serif;
            color: var.text;
            overflow: hidden;
        }

        #map {
            width: 100%;
            height: 100%;
            background: #000;
        }

        .header {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 1000;
            background: var.panel;
            padding: 15px 25px;
            border-radius: 12px;
            border: 1px solid rgba(0, 240, 255, 0.3);
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        h1 {
            margin: 0;
            font-size: 22px;
            color: var.accent;
            letter-spacing: 1px;
        }

        p {
            margin: 5px 0 0;
            opacity: 0.7;
            font-size: 13px;
        }

        .back-btn {
            position: absolute;
            top: 85px;
            left: 20px;
            z-index: 1000;
            background: var.panel;
            color: var.text;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 8px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }

        .back-btn:hover {
            background: var.accent;
            color: #000;
        }

        /* Custom Popup Style */
        .leaflet-popup-content-wrapper {
            background: var.panel !important;
            color: var.text !important;
            border: 1px solid var.accent;
            backdrop-filter: blur(10px);
        }

        .leaflet-popup-tip {
            background: var.accent !important;
        }

        .popup-title {
            font-weight: 600;
            color: var.accent;
            margin-bottom: 5px;
        }

        .popup-cat {
            font-size: 12px;
            opacity: 0.8;
            margin-bottom: 8px;
        }

        .popup-link {
            display: inline-block;
            margin-top: 10px;
            color: #ffcc44;
            text-decoration: none;
            font-size: 13px;
        }

        .popup-link:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <div class="header">
        <h1>🌌 Suseo Intelligence Map</h1>
        <p>강남구 수서동 상권 데이터 지리적 분포</p>
    </div>

    <button class="back-btn" onclick="location.href='/'">← Return to Nebula</button>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map', {
            zoomControl: false
        }).setView([37.487, 127.101], 15);

        // Dark theme tiles
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; OpenStreetMap contributors &copy; CARTO'
        }).addTo(map);

        L.control.zoom({ position: 'bottomright' }).addTo(map);

        // Load data
        async function loadShops() {
            try {
                const resp = await fetch('/api/shops/suseo');
                const shops = await resp.json();

                const markers = L.layerGroup().addTo(map);

                shops.forEach(shop => {
                    const marker = L.circleMarker([shop.lat, shop.lng], {
                        radius: 5,
                        fillColor: "#00f0ff",
                        color: "#fff",
                        weight: 1,
                        opacity: 1,
                        fillOpacity: 0.8
                    });

                    const popupContent = `
                        <div class="popup-title">${shop.name}</div>
                        <div class="popup-cat">🏷️ ${shop.category}</div>
                        <div style="font-size: 11px; opacity: 0.6;">📍 ${shop.address}</div>
                        <a href="https://www.google.com/maps/search/?api=1&query=${shop.lat},${shop.lng}" target="_blank" class="popup-link">🔗 View on Google Maps</a>
                    `;

                    marker.bindPopup(popupContent);
                    markers.addLayer(marker);
                });
            } catch (err) {
                console.error("Map Load Error:", err);
            }
        }

        loadShops();
    </script>
</body>

</html>
